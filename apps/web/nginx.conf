server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page app: unknown paths are routes, not missing files.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Same-origin API so the browser needs no CORS grant.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Research runs are queued, but exports can still be sizeable.
    proxy_read_timeout 120s;
  }

  location /health {
    proxy_pass http://api:3000/health;
  }

  location /docs {
    proxy_pass http://api:3000/docs;
  }

  location ~* \.(js|css|png|svg|woff2)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
