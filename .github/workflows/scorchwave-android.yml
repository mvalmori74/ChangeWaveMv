name: Build ScorchWave APK

on:
  push:
    paths:
      - 'scorch-android/**'
      - '.github/workflows/scorchwave-android.yml'
  pull_request:
    paths:
      - 'scorch-android/**'
  workflow_dispatch:

jobs:
  build:
    name: APK di debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('scorch-android/**/*.gradle.kts', 'scorch-android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK di debug
        working-directory: scorch-android
        run: ./gradlew --no-daemon assembleDebug

      - name: Lint
        working-directory: scorch-android
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: Pubblica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorchwave-debug-apk
          path: scorch-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Pubblica il report di lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorchwave-lint-report
          path: scorch-android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
