name: Dungeon core tests

on:
  push:
    paths:
      - 'dungeon-rogue/**'
      - '.github/workflows/dungeon-core-tests.yml'
  pull_request:
    paths:
      - 'dungeon-rogue/**'

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test del motore di gioco
        working-directory: dungeon-rogue
        # Il modulo :app richiede Android SDK: escluso esplicitamente su runner headless.
        run: ./gradlew :core:test -PskipAndroid=true --no-daemon

      - name: Pubblica i report dei test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: dungeon-rogue/core/build/reports/tests/test
