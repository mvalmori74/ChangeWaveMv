name: APK Ombra Parking

# Compila l'app su GitHub, dove la rete raggiunge i repository Google, e pubblica
# l'APK di debug fra gli artefatti della run: si scarica dalla pagina del workflow.
on:
  push:
    branches:
      - claude/android-ar-shadow-parking-0bv7zz
    paths:
      - OmbraParking/**
      - .github/workflows/android-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test e APK di debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OmbraParking

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Componenti dell'SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Test della logica
        run: ./gradlew :core:jvmTest

      - name: APK di debug
        run: ./gradlew :app:assembleDebug

      - name: Pubblica l'APK
        uses: actions/upload-artifact@v4
        with:
          name: ombra-parking-debug
          path: OmbraParking/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Pubblica i report dei test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-test
          path: OmbraParking/core/build/reports/tests/test
          if-no-files-found: ignore
