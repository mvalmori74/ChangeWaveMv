<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Libreria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Gestione Libreria</h1>
            <p>Sistema completo per la gestione di autori e libri</p>
        </header>

        <div class="tabs">
            <button class="tab-button active" onclick="showTab('authors')">Autori</button>
            <button class="tab-button" onclick="showTab('books')">Libri</button>
        </div>

        <!-- SEZIONE AUTORI -->
        <div id="authors-tab" class="tab-content active">
            <div class="section">
                <h2>Nuovo Autore</h2>
                <form id="author-form" class="form">
                    <input type="hidden" id="author-id">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="author-name">Nome *</label>
                            <input type="text" id="author-name" required>
                        </div>
                        <div class="form-group">
                            <label for="author-nationality">Nazionalità</label>
                            <input type="text" id="author-nationality">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="author-birthdate">Data di nascita</label>
                            <input type="date" id="author-birthdate">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="author-biography">Biografia</label>
                        <textarea id="author-biography" rows="3"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Salva Autore</button>
                        <button type="button" class="btn btn-secondary" onclick="resetAuthorForm()">Reset</button>
                    </div>
                </form>
            </div>

            <div class="section">
                <h2>Lista Autori</h2>
                <div id="authors-list" class="items-grid"></div>
            </div>
        </div>

        <!-- SEZIONE LIBRI -->
        <div id="books-tab" class="tab-content">
            <div class="section">
                <h2>Nuovo Libro</h2>
                <form id="book-form" class="form">
                    <input type="hidden" id="book-id">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="book-title">Titolo *</label>
                            <input type="text" id="book-title" required>
                        </div>
                        <div class="form-group">
                            <label for="book-author">Autore *</label>
                            <select id="book-author" required>
                                <option value="">Seleziona autore...</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="book-isbn">ISBN</label>
                            <input type="text" id="book-isbn">
                        </div>
                        <div class="form-group">
                            <label for="book-genre">Genere</label>
                            <input type="text" id="book-genre">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="book-year">Anno pubblicazione</label>
                            <input type="number" id="book-year" min="1000" max="2100">
                        </div>
                        <div class="form-group">
                            <label for="book-pages">Pagine</label>
                            <input type="number" id="book-pages" min="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="book-description">Descrizione</label>
                        <textarea id="book-description" rows="3"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Salva Libro</button>
                        <button type="button" class="btn btn-secondary" onclick="resetBookForm()">Reset</button>
                    </div>
                </form>
            </div>

            <div class="section">
                <h2>Lista Libri</h2>
                <div class="filter-bar">
                    <select id="filter-author" onchange="loadBooks()">
                        <option value="">Tutti gli autori</option>
                    </select>
                </div>
                <div id="books-list" class="items-grid"></div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="app.js"></script>
</body>
</html>
